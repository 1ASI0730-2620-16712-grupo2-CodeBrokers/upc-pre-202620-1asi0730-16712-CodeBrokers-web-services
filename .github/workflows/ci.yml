
name: VitaLink Backend CI

on:
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore VitaLink.Platform.sln

      - name: Build backend
        run: dotnet build VitaLink.Platform.sln --configuration Release --no-restore
